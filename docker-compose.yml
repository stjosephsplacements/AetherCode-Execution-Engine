# AetherCode Execution Engine — full local development stack.
#
#   docker compose up --build
#
# Engine health:  curl http://127.0.0.1:5100/api/v1/health
#
# The go-judge service runs with `privileged: true` because its sandbox must
# create cgroups + namespaces. That is acceptable for a disposable dev stack on
# a machine you control; for production use the systemd deployment
# (deploy/systemd/aethercode-exec.service) with explicit resource limits instead.

name: aethercode

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aethercode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aethercode_exec}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aethercode} -d $${POSTGRES_DB:-aethercode_exec}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  go-judge:
    build:
      context: ./docker/go-judge
    privileged: true # cgroups + namespaces for the sandbox (dev only)
    volumes:
      - gojudge-data:/opt/file-store
    command:
      - "-http-addr=0.0.0.0:5050"
      - "-mount-conf=/opt/mount.yaml"
      - "-enable-cpu-rate"
      - "-auth-token=${AC_JUDGE_TOKEN}"
      - "-parallelism=8"
      - "-output-limit=16m"
      - "-copy-out-limit=16m"
      - "-dir=/opt/file-store"
    ports:
      - "127.0.0.1:5050:5050"

  engine:
    build: .
    environment:
      AC_GATEWAY_ADDR: "0.0.0.0:5100"
      AC_DATABASE_URL: "postgres://${POSTGRES_USER:-aethercode}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aethercode_exec}"
      AC_REDIS_ADDR: "redis:6379"
      AC_JUDGE_URL: "http://go-judge:5050"
      AC_JUDGE_TOKEN: "${AC_JUDGE_TOKEN}"
      AC_WORKER_COUNT: "8"
      AC_AUTH_ENABLED: "${AC_AUTH_ENABLED:-false}"
      AC_ALLOW_UNAUTH: "true"
      AC_LOG_FORMAT: "text"
    ports:
      - "5100:5100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-judge:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:5100/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Rust engine (distroless image: no shell or curl, hence no container healthcheck).
  #   docker compose --profile rust up --build engine-rs        # API on http://127.0.0.1:5101
  # Own submit/run/bulk streams so it never competes with the Go engine's consumers.
  # Probes: /livez and /readyz on 5101. Metrics stay on the container's loopback (AC_DEBUG_ADDR default).
  engine-rs:
    profiles: ["rust"]
    build:
      context: .
      dockerfile: rust/Dockerfile
      args:
        COMMIT_SHA: "${COMMIT_SHA:-dev}"
    image: aethercode-exec-rs:dev
    environment:
      AC_GATEWAY_ADDR: "0.0.0.0:5100"
      AC_DATABASE_URL: "postgres://${POSTGRES_USER:-aethercode}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aethercode_exec}"
      AC_REDIS_ADDR: "redis:6379"
      AC_JUDGE_URL: "http://go-judge:5050"
      AC_JUDGE_TOKEN: "${AC_JUDGE_TOKEN}"
      AC_WORKERS: "${AC_WORKERS:-8}"
      AC_ROLE: "${AC_ROLE:-all}"
      AC_AUTH_ENABLED: "${AC_AUTH_ENABLED:-false}"
      AC_ALLOW_UNAUTH: "${AC_ALLOW_UNAUTH:-true}"
      AC_LOG_FORMAT: "text"
      AC_SUBMIT_STREAM: "ac:rs:submissions:submit"
      AC_RUN_STREAM: "ac:rs:submissions:run"
      AC_BULK_STREAM: "ac:rs:submissions:bulk"
    ports:
      - "5101:5100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-judge:
        condition: service_started

  # Compare-only worker beside the Go engine: reads the Go engine's streams through its own
  # consumer group and writes verdicts to ac:shadow:<job_id> only (no Postgres, events or webhooks).
  #   docker compose --profile rust-shadow up --build engine-rs-shadow
  engine-rs-shadow:
    profiles: ["rust-shadow"]
    build:
      context: .
      dockerfile: rust/Dockerfile
      args:
        COMMIT_SHA: "${COMMIT_SHA:-dev}"
    image: aethercode-exec-rs:dev
    command: ["--role", "worker", "--shadow"]
    environment:
      # Dev default is the owner DSN. Outside a throwaway stack set AC_SHADOW_DATABASE_URL to a
      # read-only role (SQL in docs/ARCHITECTURE.md, "Shadow database role").
      AC_DATABASE_URL: "${AC_SHADOW_DATABASE_URL:-postgres://${POSTGRES_USER:-aethercode}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aethercode_exec}}"
      AC_REDIS_ADDR: "redis:6379"
      AC_JUDGE_URL: "http://go-judge:5050"
      AC_JUDGE_TOKEN: "${AC_JUDGE_TOKEN}"
      AC_WORKERS: "${AC_WORKERS:-8}"
      AC_LOG_FORMAT: "text"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-judge:
        condition: service_started

volumes:
  db-data:
  gojudge-data:
