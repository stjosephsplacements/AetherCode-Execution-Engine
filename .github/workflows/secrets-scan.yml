name: secrets-scan

# Scan every PR diff for accidentally committed secrets using
# truffleHog — catches API keys, tokens, connection strings, private keys
# before they ever land on development.

on:
  pull_request:
    branches: [development, production]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@v3.88.28
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
