name: one-pr-per-contributor

# Enforce: a contributor may have at most one open PR targeting development
# at a time. Opening a second PR while one is still open will fail this check
# and post a comment explaining why.
#
# Exceptions:
#   - dependabot[bot] and github-actions[bot] are exempt (they batch updates)
#   - Org members with write access are exempt (maintainers may stack PRs)

on:
  pull_request:
    branches: [development]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Enforce one open PR per contributor
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          AUTHOR="${{ github.event.pull_request.user.login }}"
          PR="${{ github.event.pull_request.number }}"

          # Exempt bots and org members with write access
          case "${AUTHOR}" in
            dependabot\[bot\]|github-actions\[bot\]|app/*)
              echo "Bot account ${AUTHOR} — exempted."
              exit 0
              ;;
          esac

          # Check if the author has write permission (maintainers may stack PRs)
          PERM=$(gh api "repos/${REPO}/collaborators/${AUTHOR}/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          if [[ "$PERM" == "admin" || "$PERM" == "write" || "$PERM" == "maintain" ]]; then
            echo "Author ${AUTHOR} has '${PERM}' permission — exempted."
            exit 0
          fi

          # Count other open PRs by this author targeting development
          OTHER_PRS=$(gh pr list \
            --repo "$REPO" \
            --base development \
            --state open \
            --author "$AUTHOR" \
            --json number \
            --jq "[.[] | select(.number != ${PR})] | length")

          echo "Author: ${AUTHOR}, this PR: #${PR}, other open PRs: ${OTHER_PRS}"

          if [ "${OTHER_PRS:-0}" -gt 0 ]; then
            OTHER_LIST=$(gh pr list \
              --repo "$REPO" \
              --base development \
              --state open \
              --author "$AUTHOR" \
              --json number,title \
              --jq "[.[] | select(.number != ${PR})] | .[] | \"#\(.number) — \(.title)\"" \
              | head -5)

            gh pr comment "$PR" --repo "$REPO" --body "$(cat <<EOF
## ❌ One open PR per contributor

Hi @${AUTHOR}! This project enforces a **one open PR per contributor** rule to keep reviews focused and reviewers from being overwhelmed.

You already have the following open PR(s) targeting \`development\`:

${OTHER_LIST}

Please either:
1. **Close this PR** and continue on your existing one, or
2. **Get your existing PR merged first**, then reopen or create a new one.

If you believe this is a mistake (e.g. you are working on separate issues and a maintainer approved parallel work), please ask a maintainer to add the \`allow-parallel\` label to this PR.
EOF
)"
            echo "::error::${AUTHOR} already has ${OTHER_PRS} open PR(s) targeting development. One PR per contributor is required."
            exit 1
          fi

          echo "OK — ${AUTHOR} has no other open PRs targeting development."
