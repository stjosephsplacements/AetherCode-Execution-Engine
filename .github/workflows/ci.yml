name: CI

# Every promotion (development -> testing -> staging -> production) is a PR
# that must be green on CI. CI also runs on direct pushes to each branch.
on:
  push:
    branches: [development, testing, staging, production]
  pull_request:

# The engine is audited-by-default: this is a code-execution service, so the
# PR pipeline is the main line of defense.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Module tidy check
        run: |
          go mod tidy
          # --exit-code (the canonical flag) is portable across git versions;
          # `-- go.mod go.sum` forces pathspec form. Exits 1 if tidy changed them.
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -s -d $unformatted
            exit 1
          fi

      # Unit tests are hermetic (the rate limiter uses an in-process
      # miniredis), so no external services are required here.
      - name: Test (race detector)
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        # golangci-lint v2 (config schema v2 — see .golangci.yml). v1.64 was
        # built with Go 1.24 and refuses to lint this module's go 1.25
        # directive; v2 is built with Go 1.25+. Pinned to v2.12.2 — the
        # release this config and codebase were verified against, so CI and
        # local `golangci-lint run` lint identically. Note: golangci-lint v2
        # requires golangci-lint-action v7 (v6 only supports the v1 line).
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m
