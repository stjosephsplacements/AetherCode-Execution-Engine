name: CI

# Every promotion (development -> production) is a PR that must be green on
# CI. CI also runs on direct pushes to each branch.
on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Required checks (test, lint) no-op for Dependabot so auto-merge can finish
  # without a full Go/CodeQL run. CodeQL runs on push only (not every PR).
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Dependabot gate
        id: gate
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.skip != 'true'
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - if: steps.gate.outputs.skip != 'true'
        name: Module tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - if: steps.gate.outputs.skip != 'true'
        name: Build
        run: go build ./...
      - if: steps.gate.outputs.skip != 'true'
        name: Vet
        run: go vet ./...
      - if: steps.gate.outputs.skip != 'true'
        name: Format check
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -s -d $unformatted
            exit 1
          fi
      - if: steps.gate.outputs.skip != 'true'
        name: Test (race detector + coverage)
        run: go test -race -count=1 -timeout=120s -coverprofile=coverage.out -covermode=atomic ./...
      - if: steps.gate.outputs.skip != 'true'
        name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: unit
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Dependabot gate
        id: gate
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.skip != 'true'
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - if: steps.gate.outputs.skip != 'true'
        name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

  codeql:
    name: CodeQL Analysis
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended,security-and-quality
      - name: Build for CodeQL
        run: go build ./...
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
          upload-database: false

  codeql-rust:
    name: CodeQL Analysis (Rust)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust
          upload-database: false
