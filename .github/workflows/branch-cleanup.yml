name: branch-cleanup

# Auto-delete feature/topic branches after they are merged.
#
# Fires when a PR is closed *and merged*. If the PR's head branch is one of the
# four main branches (development/testing/staging/production) we leave it alone;
# otherwise it was an ephemeral feature branch and we delete it. This is the
# "delete branches after merging" guarantee (GitHub's rulesets API has no
# delete-on-merge rule, so this workflow provides it).

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete merged feature branch (keep main branches)
        run: |
          set -euo pipefail
          HEAD="${{ github.event.pull_request.head.ref }}"
          REPO="${GITHUB_REPOSITORY}"
          case "${HEAD}" in
            development|testing|staging|production)
              echo "Head branch '${HEAD}' is a main branch; keeping it."
              exit 0
              ;;
          esac
          echo "Deleting merged feature branch '${HEAD}'"
          git push origin --delete "${HEAD}" \
            || gh api -X DELETE "repos/${REPO}/git/refs/heads/${HEAD}" \
            || echo "branch '${HEAD}' already gone"
