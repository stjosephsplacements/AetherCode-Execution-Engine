version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    target-branch: development
    open-pull-requests-limit: 10
    labels: [dependencies, gomod]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    target-branch: development
    open-pull-requests-limit: 10
    labels: [dependencies, rust]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      rust-deps:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    target-branch: development
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    target-branch: development
    open-pull-requests-limit: 10
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
