# RuntimeClass for gVisor (runsc). It is NOT part of the base kustomization: a pod that names a
# RuntimeClass the node cannot run is rejected, so apply this only on nodes where runsc is installed
# and registered with containerd (see docs/GVISOR.md), then use the rust-gvisor overlay.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
