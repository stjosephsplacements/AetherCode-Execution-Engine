apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aethercode-exec-network-policy
  namespace: aethercode
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aethercode-exec
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic to gateway HTTP and metrics from inside cluster
    - from: []
      ports:
        - protocol: TCP
          port: 5100
        - protocol: TCP
          port: 6060
  egress:
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow go-judge sandbox
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: go-judge
      ports:
        - protocol: TCP
          port: 5050
    # PostgreSQL — restrict to the database pod within the namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis — restrict to the Redis pod within the namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # OIDC issuer (port 443) — restrict per-deployment to the IdP's CIDR range.
    # Default: allow all 443 egress. Operators should replace 0.0.0.0/0 with the
    # actual IdP IP range once known.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: go-judge-network-policy
  namespace: aethercode
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: go-judge
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the execution engine can send sandbox jobs to go-judge
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aethercode-exec
      ports:
        - protocol: TCP
          port: 5050
  egress:
    # go-judge sandboxed executions should NOT have unrestricted network access
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
