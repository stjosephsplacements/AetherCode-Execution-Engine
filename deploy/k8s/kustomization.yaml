apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aethercode

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - go-judge-configmap.yaml
  - go-judge.yaml
  - networkpolicy.yaml

# Secrets are never committed to VCS.
# Copy deploy/k8s/.env.secret.example to deploy/k8s/.env.secret, fill in real
# values, then run: kubectl apply -k deploy/k8s/
# .env.secret is gitignored and must never be committed.
secretGenerator:
  - name: aethercode-exec-secrets
    envs:
      - .env.secret

# Override image tag for a specific release:
#   kustomize edit set image ghcr.io/stjosephsplacements/aethercode-execution-engine=:v1.2.3
images:
  - name: ghcr.io/stjosephsplacements/aethercode-execution-engine
    newTag: latest
