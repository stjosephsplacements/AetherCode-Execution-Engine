apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aethercode

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - go-judge-configmap.yaml
  - go-judge.yaml
  - networkpolicy.yaml

# Override image tag for a specific release:
#   kustomize edit set image ghcr.io/stjosephsplacements/aethercode-execution-engine=:v1.2.3
images:
  - name: ghcr.io/stjosephsplacements/aethercode-execution-engine
    newTag: latest
