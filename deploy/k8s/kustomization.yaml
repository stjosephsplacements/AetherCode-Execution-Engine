apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aethercode

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - go-judge-configmap.yaml
  - go-judge.yaml
  - networkpolicy.yaml

# Secrets are never committed or generated here. Create `aethercode-exec-secrets`
# out of band (see deploy/SECRETS.md). Local/dev may still use:
#   kubectl -n aethercode create secret generic aethercode-exec-secrets --from-env-file=deploy/k8s/.env.secret

# Override image tag for a specific release:
#   kustomize edit set image ghcr.io/stjosephsplacements/aethercode-execution-engine=:v1.2.3
images:
  - name: ghcr.io/stjosephsplacements/aethercode-execution-engine
    newTag: SET_ME
