# Prometheus is admitted on 6060 from namespaces labelled kubernetes.io/metadata.name=monitoring
# AND pods labelled app.kubernetes.io/name=prometheus. Edit both selectors to match your
# installation. Kubelet probes are not blocked by NetworkPolicy.
# The shadow worker takes no client traffic (and no Service selects it): only Prometheus on 6060; egress to DNS, go-judge, Postgres, Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aethercode-exec-rs-shadow-network-policy
  namespace: aethercode
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aethercode-exec-rs
      app.kubernetes.io/component: shadow-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 6060
  egress:
    # DNS only to the cluster resolver: `to: []` would allow port 53 to any address.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: go-judge
      ports:
        - protocol: TCP
          port: 5050
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
---
# WARNING: a NetworkPolicy that selects pods with policyTypes Ingress isolates them. This one is additive only when the
# base (deploy/k8s) go-judge policy, which admits the Go engine, is applied. If nothing else selects go-judge, applying
# this alone cuts the Go engine and everything behind it off from go-judge. Check `kubectl -n aethercode get netpol`
# for go-judge-network-policy first; if it is absent, delete this policy instead of applying it.
#
# The egress rules above also assume Postgres and Redis run in this namespace. When they run elsewhere (for example the
# `production` and `redis` namespaces) add a namespaceSelector egress rule for each, or the worker cannot start.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: go-judge-allow-rust-shadow
  namespace: aethercode
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: go-judge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aethercode-exec-rs
              app.kubernetes.io/component: shadow-worker
      ports:
        - protocol: TCP
          port: 5050
