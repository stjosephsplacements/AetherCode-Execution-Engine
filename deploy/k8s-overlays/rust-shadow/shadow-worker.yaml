# Compare-only worker beside the Go engine: own consumer group (<AC_CONSUMER_GROUP>-rust), no Postgres writes,
# events or webhooks; verdicts go to ac:shadow:<job_id> for ae-shadowdiff. Scale to 0 after cutover.
# Uses aethercode-exec-shadow (read-only DB role), never the owner DSN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aethercode-exec-rs-shadow-worker
  namespace: aethercode
  labels:
    app.kubernetes.io/name: aethercode-exec-rs
    app.kubernetes.io/component: shadow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aethercode-exec-rs
      app.kubernetes.io/component: shadow-worker
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aethercode-exec-rs
        app.kubernetes.io/component: shadow-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # 120 s job drain + HTTP close margin. No preStop: the engine keeps serving (not
      # ready) while it drains, so in-flight clients can still read results.
      terminationGracePeriodSeconds: 150
      containers:
        - name: engine
          # The tag comes from images: in kustomization.yaml (kustomize edit set image).
          image: ghcr.io/stjosephsplacements/aethercode-exec-rs
          imagePullPolicy: IfNotPresent
          args: ["--role", "worker", "--shadow"]
          ports:
            - {name: debug, containerPort: 6060, protocol: TCP}
          envFrom:
            - configMapRef:
                name: aethercode-exec-config
            - configMapRef:
                name: aethercode-exec-rs-shadow-config
            - secretRef:
                name: aethercode-exec-shadow
          resources:
            requests: {cpu: "2000m", memory: "1Gi"}
            limits: {cpu: "8000m", memory: "4Gi"}
          # Worker pods serve no public HTTP; probes use the debug listener (AC_DEBUG_ADDR=0.0.0.0).
          startupProbe:
            httpGet: {path: /livez, port: 6060}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /livez, port: 6060}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 6060}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
