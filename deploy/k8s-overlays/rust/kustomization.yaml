# Adds the Rust engine beside the Go engine. The Go resources are untouched:
#
#   kubectl apply -k deploy/k8s-overlays/rust/
#
# Prerequisites:
#   - deploy/k8s/.env.secret (same secret the Go engine uses; see .env.secret.example)
#   - an external-metrics API serving ac_queue_age_seconds for the worker HPA
#     (Prometheus Adapter, or KEDA; see hpa.yaml and docs/ARCHITECTURE.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aethercode

resources:
  - ../../k8s
  - configmap.yaml
  - metrics-proxy-configmap.yaml
  - gateway.yaml
  - worker.yaml
  - shadow-worker.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml

# The Rust image is built from rust/Dockerfile. It is not published by the release
# workflow yet; set the registry and tag you pushed it to:
#   kustomize edit set image ghcr.io/stjosephsplacements/aethercode-exec-rs=<registry>/aethercode-exec-rs:<tag>
images:
  - name: ghcr.io/stjosephsplacements/aethercode-exec-rs
    newTag: latest
