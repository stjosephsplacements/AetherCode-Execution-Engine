# Rust engine, gateway role: POST /api/v1/execute, SSE, results. Replicas are owned by the HPA (hpa.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aethercode-exec-rs-gateway
  namespace: aethercode
  labels:
    app.kubernetes.io/name: aethercode-exec-rs
    app.kubernetes.io/component: gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aethercode-exec-rs
      app.kubernetes.io/component: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aethercode-exec-rs
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # 120 s job drain + HTTP close margin. No preStop: the engine keeps serving (not
      # ready) while it drains, so in-flight clients can still read results.
      terminationGracePeriodSeconds: 150
      containers:
        - name: engine
          # The tag comes from images: in kustomization.yaml (kustomize edit set image).
          image: ghcr.io/stjosephsplacements/aethercode-exec-rs
          imagePullPolicy: IfNotPresent
          args: ["--role", "gateway"]
          ports:
            - {name: http, containerPort: 5100, protocol: TCP}
            - {name: debug, containerPort: 6060, protocol: TCP}
          envFrom:
            - configMapRef:
                name: aethercode-exec-config
            - configMapRef:
                name: aethercode-exec-rs-config
            - secretRef:
                name: aethercode-exec-secrets
          env:
            - {name: AC_GATEWAY_ADDR, value: "0.0.0.0:5100"}
            - {name: AC_AUTH_ENABLED, value: "true"}
          resources:
            requests: {cpu: "500m", memory: "256Mi"}
            limits: {cpu: "2000m", memory: "1Gi"}
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 5
            failureThreshold: 60    # up to 5 min: DB, Redis, sandbox self-tests, pre-warm
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}   # 503 until startup finishes and again while draining
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
