# Rust engine, gateway role: POST /api/v1/execute, SSE, results. Needs go-judge for health and language self-tests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aethercode-exec-rs-gateway
  namespace: aethercode
  labels:
    app.kubernetes.io/name: aethercode-exec-rs
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aethercode-exec-rs
      app.kubernetes.io/component: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aethercode-exec-rs
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # 120 s job drain + HTTP close margin. No preStop: the engine keeps serving (not
      # ready) while it drains, so in-flight clients can still read results.
      terminationGracePeriodSeconds: 150
      containers:
        - name: engine
          image: ghcr.io/stjosephsplacements/aethercode-exec-rs:latest
          imagePullPolicy: Always
          args: ["--role", "gateway"]
          ports:
            - {name: http, containerPort: 5100, protocol: TCP}
          envFrom:
            - configMapRef:
                name: aethercode-exec-config
            - configMapRef:
                name: aethercode-exec-rs-config
            - secretRef:
                name: aethercode-exec-secrets
          env:
            - {name: AC_AUTH_ENABLED, value: "true"}
            - {name: AC_GATEWAY_ADDR, value: "0.0.0.0:5100"}
          resources:
            requests: {cpu: "500m", memory: "256Mi"}
            limits: {cpu: "2000m", memory: "1Gi"}
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 5
            failureThreshold: 60    # up to 5 min: DB, Redis, sandbox self-tests, pre-warm
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}   # 503 until startup finishes and again while draining
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        # Exposes the loopback-only metrics listener to Prometheus; see metrics-proxy-configmap.yaml.
        - name: metrics-proxy
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - {name: metrics, containerPort: 9090, protocol: TCP}
          resources:
            requests: {cpu: "10m", memory: "16Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: nginx-conf
          configMap:
            name: aethercode-exec-rs-metrics-proxy
        - name: tmp
          emptyDir: {}
