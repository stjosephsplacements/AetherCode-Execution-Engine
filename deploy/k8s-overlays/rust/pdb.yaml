apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aethercode-exec-rs-gateway-pdb
  namespace: aethercode
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aethercode-exec-rs
      app.kubernetes.io/component: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aethercode-exec-rs-worker-pdb
  namespace: aethercode
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aethercode-exec-rs
      app.kubernetes.io/component: worker
