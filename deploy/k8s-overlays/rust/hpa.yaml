# Gateway: CPU. Workers: age of the oldest queue entry.
#
# The worker HPA needs the external metrics API (external.metrics.k8s.io) to serve
# ac_queue_age_seconds_max. Define it with ONE of:
#
# 1. Prometheus Adapter (externalRules). The stream filter lives in the query because
#    label values such as "ac:submissions:submit" are not valid selector values:
#      externalRules:
#        - seriesQuery: 'ac_queue_age_seconds'
#          resources: {namespaced: false}
#          name: {as: "ac_queue_age_seconds_max"}
#          metricsQuery: 'max(ac_queue_age_seconds{stream=~"ac:submissions:(submit|run)"})'
#    (max, not sum: every pod samples the same streams, so the series are duplicates).
#
# 2. KEDA: delete this HPA for the workers and use a ScaledObject:
#      apiVersion: keda.sh/v1alpha1
#      kind: ScaledObject
#      metadata: {name: aethercode-exec-rs-worker, namespace: aethercode}
#      spec:
#        scaleTargetRef: {name: aethercode-exec-rs-worker}
#        minReplicaCount: 2
#        maxReplicaCount: 20
#        triggers:
#          - type: prometheus
#            metadata:
#              serverAddress: http://prometheus.monitoring:9090
#              query: max(ac_queue_age_seconds{stream=~"ac:submissions:(submit|run)"})
#              threshold: "10"
#
# Without one of them this HPA reports "unable to get external metric" and holds its replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aethercode-exec-rs-worker-hpa
  namespace: aethercode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aethercode-exec-rs-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: External
      external:
        metric:
          name: ac_queue_age_seconds_max
        target:
          type: Value
          value: "10"   # seconds the oldest entry may wait
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # pods drain for up to 120 s; scale in slowly
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aethercode-exec-rs-gateway-hpa
  namespace: aethercode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aethercode-exec-rs-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
