# Compare-only worker beside the Go engine: own consumer group (<AC_CONSUMER_GROUP>-rust), no Postgres writes, events or webhooks;
# verdicts go to ac:shadow:<job_id> for ae-shadowdiff. Scale to 0 after cutover.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aethercode-exec-rs-shadow-worker
  namespace: aethercode
  labels:
    app.kubernetes.io/name: aethercode-exec-rs
    app.kubernetes.io/component: shadow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aethercode-exec-rs
      app.kubernetes.io/component: shadow-worker
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aethercode-exec-rs
        app.kubernetes.io/component: shadow-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # 120 s job drain + HTTP close margin. No preStop: the engine keeps serving (not
      # ready) while it drains, so in-flight clients can still read results.
      terminationGracePeriodSeconds: 150
      containers:
        - name: engine
          image: ghcr.io/stjosephsplacements/aethercode-exec-rs:latest
          imagePullPolicy: Always
          args: ["--role", "worker", "--shadow"]
          envFrom:
            - configMapRef:
                name: aethercode-exec-config
            - configMapRef:
                name: aethercode-exec-rs-config
            - secretRef:
                name: aethercode-exec-secrets
          env:
            - {name: AC_AUTH_ENABLED, value: "true"}
          resources:
            requests: {cpu: "2000m", memory: "1Gi"}
            limits: {cpu: "8000m", memory: "4Gi"}
          # Worker pods serve no public HTTP; liveness goes through the metrics proxy.
          startupProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        # Exposes the loopback-only metrics listener to Prometheus; see metrics-proxy-configmap.yaml.
        - name: metrics-proxy
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - {name: metrics, containerPort: 9090, protocol: TCP}
          resources:
            requests: {cpu: "10m", memory: "16Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: nginx-conf
          configMap:
            name: aethercode-exec-rs-metrics-proxy
        - name: tmp
          emptyDir: {}
