# In-cluster Redis for EE streams / compile cache. ClusterIP only. PVC Retain.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aethercode-exec-redis
  namespace: aethercode
  labels:
    app.kubernetes.io/part-of: aethercode
    app.kubernetes.io/name: aethercode-exec-redis
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-production
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aethercode-exec-redis
  namespace: aethercode
  labels:
    app.kubernetes.io/part-of: aethercode
    app.kubernetes.io/name: aethercode-exec-redis
spec:
  serviceName: aethercode-exec-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aethercode-exec-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: aethercode
        app.kubernetes.io/name: aethercode-exec-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aethercode-exec-secrets
                  key: AC_REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aethercode-exec-redis
---
apiVersion: v1
kind: Service
metadata:
  name: aethercode-exec-redis
  namespace: aethercode
  labels:
    app.kubernetes.io/name: aethercode-exec-redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: aethercode-exec-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aethercode-exec-redis-pdb
  namespace: aethercode
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aethercode-exec-redis
