apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aethercode-exec
  namespace: aethercode
  labels:
    release: kube-prometheus
    app.kubernetes.io/part-of: aethercode
    app.kubernetes.io/name: aethercode-exec
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aethercode-exec
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
