apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aethercode-exec-hpa
  namespace: aethercode
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
