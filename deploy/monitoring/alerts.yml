groups:
  - name: aethercode-exec
    rules:
      # ── Poison / dead-letter ────────────────────────────────────────────────
      - alert: PoisonMessages
        expr: increase(ac_poison_messages_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dead-lettered submission messages detected"
          description: >
            {{ $value }} message(s) have been dead-lettered in the last 5 minutes.
            These submissions will never receive a verdict. Check logs for the
            root cause (sandbox crash, DB write failure, or reclaimer bug).

      # ── Worker stall ────────────────────────────────────────────────────────
      - alert: AllWorkersIdle
        expr: ac_active_workers == 0 and sum(ac_queue_depth) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "All workers idle with non-empty queue"
          description: >
            No workers are processing jobs but the queue depth is
            {{ $value }}. Workers may have panicked and not restarted,
            or the Redis consumer group may have stalled.

      # ── Queue pressure ──────────────────────────────────────────────────────
      - alert: HighQueueDepth
        expr: ac_queue_depth > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue depth {{ $labels.stream }} is high ({{ $value }})"
          description: >
            The Redis stream {{ $labels.stream }} has exceeded 1000 entries
            for 5 minutes. Consider scaling up workers or reducing submission rate.

      # ── Internal error rate ─────────────────────────────────────────────────
      - alert: HighInternalErrorRate
        expr: >
          rate(ac_jobs_processed_total{verdict="internal_error"}[5m])
          / rate(ac_jobs_processed_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Internal error rate above 5%"
          description: >
            More than 5% of processed jobs are resulting in internal_error
            verdicts. Check go-judge connectivity, DB health, and worker logs.

      # ── Gateway 5xx rate ────────────────────────────────────────────────────
      - alert: GatewayHighErrorRate
        expr: >
          rate(ac_http_requests_total{code=~"5.."}[5m])
          / rate(ac_http_requests_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway 5xx error rate above 1%"
          description: >
            The HTTP gateway is returning 5xx responses at >1% of total traffic.
            Check DB pool exhaustion, Redis connectivity, and application logs.

      # ── Service down ────────────────────────────────────────────────────────
      - alert: GatewayDown
        expr: up{job="aethercode-exec"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AetherCode Execution Engine is down"
          description: >
            Prometheus cannot scrape the aethercode-exec metrics endpoint.
            The process may have crashed or the host may be unreachable.

      # ── Latency (see README, "Performance Tuning") ──────────────────────────
      - alert: QueueWaitP99High
        expr: histogram_quantile(0.99, sum by (le, stream) (rate(ac_queue_wait_seconds_bucket[5m]))) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Jobs in {{ $labels.stream }} wait more than 30s at the p99"
          description: >
            The p99 wait between enqueue and a worker reading the job is
            {{ $value | humanizeDuration }}. Workers or sandbox slots are the
            bottleneck: compare AC_WORKER_COUNT with go-judge -parallelism and CPU.

      - alert: JobStageP99High
        expr: histogram_quantile(0.99, sum by (le, stage) (rate(ac_job_stage_seconds_bucket{stage=~"claim|load_tests|persist|publish"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The {{ $labels.stage }} stage takes more than 1s at the p99"
          description: >
            claim, persist and publish are database and Redis round trips and
            load_tests is a Redis read. Check PostgreSQL and Redis latency and
            the connection pool sizes (AC_DB_MAX_CONNS, AC_REDIS_POOL_SIZE).

      - alert: CompileCacheMostlyMissing
        expr: >
          sum(rate(ac_compile_cache_misses_total[15m]))
          / (sum(rate(ac_compile_cache_hits_total[15m])) + sum(rate(ac_compile_cache_misses_total[15m]))) > 0.9
          and sum(rate(ac_compile_cache_misses_total[15m])) > 0.5
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Almost every compile is a cache miss"
          description: >
            Expected when every job carries different source. If one source is
            sent as many jobs (one per test), check that the caller is not
            defeating the compile cache.
