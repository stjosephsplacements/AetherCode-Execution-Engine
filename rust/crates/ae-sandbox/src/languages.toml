# Built-in language table. It is the only place command templates are defined.
# Replace it at startup with AC_LANGUAGES_FILE (same shape).
#
# Per language:
#   compiler      argv of the toolchain version probe (`--version`)
#   compile_cmd   compile template (absent for interpreted languages)
#   execute_cmd   run template
#   *.limits      cpu (ns), memory (bytes), procs; execute_cmd.limits.min_memory
#                 is the floor for a per-request memory limit (JVM heap + metaspace)
#   compile_cmd.defaults  flags appended unless a caller flag has the same name
#   allowed_flags caller compiler flags accepted for the language
#   parallelism   concurrent tests per job; absent means unbounded
#   overlay       where the source and binary live inside the sandbox; stdin_is_source
#                 delivers the source on stdin instead of as a file
#   hello         self-test program; it must print "hello"

[languages.c]
compiler = ["/usr/bin/gcc", "--version"]
allowed_flags = ["-O0", "-O1", "-O2", "-O3", "-Os", "-std=c99", "-std=c11", "-std=c17", "-lm", "-Wall", "-Wextra", "-pedantic"]
overlay = { source = "/w/main.c", binary = "/w/a.out" }
hello = '''
#include <stdio.h>
int main(void) { puts("hello"); return 0; }
'''
[languages.c.compile_cmd]
args = ["/usr/bin/gcc", "-o", "/w/a.out", "/w/main.c", "-O2", "-pipe", "-lm"]
env = ["PATH=/usr/bin:/bin"]
limits = { cpu = 10_000_000_000, memory = 268_435_456, procs = 50 }
[languages.c.execute_cmd]
args = ["/w/a.out"]
env = ["PATH=/usr/bin:/bin"]
limits = { cpu = 2_000_000_000, memory = 536_870_912, procs = 10 }

[languages.cpp]
compiler = ["/usr/bin/g++", "--version"]
allowed_flags = ["-O0", "-O1", "-O2", "-O3", "-Os", "-std=c++11", "-std=c++14", "-std=c++17", "-std=c++20", "-std=c++23", "-lm", "-Wall", "-Wextra", "-pedantic"]
overlay = { source = "/w/main.cpp", binary = "/w/a.out" }
hello = '''
#include <iostream>
int main() { std::cout << "hello\n"; return 0; }
'''
[languages.cpp.compile_cmd]
args = ["/usr/bin/g++", "-o", "/w/a.out", "/w/main.cpp", "-O2", "-pipe", "-std=c++17"]
env = ["PATH=/usr/bin:/bin"]
limits = { cpu = 10_000_000_000, memory = 268_435_456, procs = 50 }
[languages.cpp.execute_cmd]
args = ["/w/a.out"]
env = ["PATH=/usr/bin:/bin"]
limits = { cpu = 2_000_000_000, memory = 536_870_912, procs = 10 }

[languages.go]
compiler = ["/usr/bin/go", "version"]
overlay = { source = "/w/main.go", binary = "/w/main" }
hello = '''
package main

import "fmt"

func main() { fmt.Println("hello") }
'''
[languages.go.compile_cmd]
args = ["/usr/bin/go", "build", "-o", "/w/main", "/w/main.go"]
env = ["PATH=/usr/bin:/bin", "GOROOT=/usr/lib/go-1.22", "HOME=/tmp", "GOCACHE=/tmp/go-cache"]
limits = { cpu = 30_000_000_000, memory = 1_073_741_824, procs = 512 }
[languages.go.execute_cmd]
args = ["/w/main"]
env = ["PATH=/usr/bin:/bin"]
limits = { cpu = 2_000_000_000, memory = 536_870_912, procs = 20 }

[languages.java]
compiler = ["/usr/bin/javac", "--version"]
parallelism = 4
overlay = { source = "/w/Main.java", binary = "/w/Main.class" }
hello = '''
public class Main { public static void main(String[] a) { System.out.println("hello"); } }
'''
[languages.java.compile_cmd]
args = ["/usr/bin/javac", "-J-XX:TieredStopAtLevel=1", "-J-XX:+UseSerialGC", "-J-Xshare:auto", "-d", "/w", "/w/Main.java"]
env = ["PATH=/usr/bin:/bin", "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64"]
limits = { cpu = 15_000_000_000, memory = 536_870_912, procs = 50 }
[languages.java.execute_cmd]
args = ["/usr/bin/java", "-XX:+TieredCompilation", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-Xshare:auto", "-cp", "/w", "Main"]
env = ["PATH=/usr/bin:/bin", "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64"]
limits = { cpu = 2_000_000_000, memory = 536_870_912, procs = 50, min_memory = 268_435_456 }

