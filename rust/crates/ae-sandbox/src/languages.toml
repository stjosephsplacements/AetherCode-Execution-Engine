[languages.kotlin]
compiler = ["/usr/bin/kotlinc", "-version"]
parallelism = 4
overlay = { source = "/w/Main.kt", binary = "/w/Main.jar" }
hello = '''
fun main() { println("hello") }
'''
[languages.kotlin.compile_cmd]
args = ["/usr/bin/kotlinc", "/w/Main.kt", "-include-runtime", "-d", "/w/Main.jar"]
env = ["PATH=/usr/bin:/bin", "KOTLIN_HOME=/usr/share/kotlin"]
limits = { cpu = 20_000_000_000, memory = 1_073_741_824, procs = 50 }
[languages.kotlin.execute_cmd]
args = ["/usr/bin/java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-Xshare:auto", "-jar", "/w/Main.jar"]
env = ["PATH=/usr/bin:/bin", "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64"]
limits = { cpu = 2_000_000_000, memory = 536_870_912, procs = 50, min_memory = 268_435_456 }

[languages.rust]
compiler = ["/usr/bin/rustc", "--version"]
allowed_flags = ["-O", "--edition=2018", "--edition=2021"]
overlay = { source = "/w/main.rs", binary = "/w/a.out" }
# try_into is only in the edition 2021 prelude, so the self-test also proves the edition.
hello = '''
fn main() { let _x: u8 = 1u32.try_into().unwrap(); println!("hello"); }
'''
[languages.rust.compile_cmd]
args = ["/usr/bin/rustc", "-O", "-o", "/w/a.out", "/w/main.rs"]
# Without --edition rustc compiles as edition 2015, where TryFrom, TryInto and
# FromIterator are not in the prelude.
defaults = ["--edition=2021"]
env = ["PATH=/usr/bin:/bin", "HOME=/tmp"]
limits = { cpu = 20_000_000_000, memory = 536_870_912, procs = 50 }
[languages.rust.execute_cmd]
args = ["/w/a.out"]
env = ["PATH=/usr/bin:/bin"]
limits = { cpu = 2_000_000_000, memory = 536_870_912, procs = 10 }

