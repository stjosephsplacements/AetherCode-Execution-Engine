[package]
name = "ae-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ae-core = { version = "0.1.0", path = "../ae-core" }
ae-db = { version = "0.1.0", path = "../ae-db" }
ae-queue = { version = "0.1.0", path = "../ae-queue" }
ae-sandbox = { version = "0.1.0", path = "../ae-sandbox" }
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2"

[dev-dependencies]
redis = { version = "1.8.1", features = ["tokio-comp", "streams", "connection-manager"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["redis", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
uuid = { version = "1.29.1", features = ["v4"] }
wiremock = "0.6.5"

[lints]
workspace = true
