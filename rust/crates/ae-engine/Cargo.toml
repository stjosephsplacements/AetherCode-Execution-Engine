[package]
name = "ae-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
ae-core = { path = "../ae-core" }
ae-db = { path = "../ae-db" }
ae-gateway = { path = "../ae-gateway" }
ae-queue = { path = "../ae-queue" }
ae-sandbox = { path = "../ae-sandbox" }
ae-worker = { path = "../ae-worker" }
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "ansi", "json"] }

[dev-dependencies]
ae-core = { path = "../ae-core" }
ae-db = { path = "../ae-db" }
ae-queue = { path = "../ae-queue" }
axum = "0.8"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["redis", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
