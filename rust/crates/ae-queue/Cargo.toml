[package]
name = "ae-queue"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ae-core = { version = "0.1.0", path = "../ae-core" }
ae-db = { version = "0.1.0", path = "../ae-db" }
aes-gcm = "0.10"
base64 = "0.22"
futures-util = "0.3.34"
rand = "0.8"
redis = { version = "1.8.1", features = ["tokio-comp", "streams", "connection-manager"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["redis", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.29.1", features = ["v4"] }
