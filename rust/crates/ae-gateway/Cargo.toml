[package]
name = "ae-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ae-core = { path = "../ae-core" }
ae-db = { path = "../ae-db" }
ae-queue = { path = "../ae-queue" }
ae-sandbox = { path = "../ae-sandbox" }
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
http = "1"
ipnet = "2"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
prometheus = { version = "0.14", default-features = false }
rand = "0.8"
redis = { version = "1", features = ["tokio-comp", "connection-manager", "script"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tower = "0.5"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

[lints]
workspace = true

[dev-dependencies]
ae-worker = { path = "../ae-worker" }
async-trait = "0.1"
serde_yaml = "0.9"
tokio-util = "0.7"
base64 = "0.22"
http-body-util = "0.1"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["redis", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
uuid = { version = "1", features = ["v4"] }
