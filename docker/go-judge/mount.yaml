# go-judge sandbox mount configuration.
# The sandbox sees: /bin, /lib, /usr (read-only), /w (writable tmpfs work dir), /tmp.
# Sensitive host paths are masked so submissions can't read them.

mount:
  # Core system
  - type: bind
    source: /bin
    target: /bin
    readonly: true
  - type: bind
    source: /lib
    target: /lib
    readonly: true
  - type: bind
    source: /lib64
    target: /lib64
    readonly: true
  - type: bind
    source: /usr
    target: /usr
    readonly: true
  - type: bind
    source: /etc/ld.so.cache
    target: /etc/ld.so.cache
    readonly: true
  - type: bind
    source: /etc/alternatives
    target: /etc/alternatives
    readonly: true

  # Java 21 JDK config
  - type: bind
    source: /etc/java-21-openjdk
    target: /etc/java-21-openjdk
    readonly: true

  # Device nodes
  - type: bind
    source: /dev/null
    target: /dev/null
  - type: bind
    source: /dev/urandom
    target: /dev/urandom
  - type: bind
    source: /dev/random
    target: /dev/random
  - type: bind
    source: /dev/zero
    target: /dev/zero
  - type: bind
    source: /dev/full
    target: /dev/full

  # Work dir (where code is compiled and run)
  - type: tmpfs
    target: /w
    data: size=128m,nr_inodes=4k
  # Temp dir
  - type: tmpfs
    target: /tmp
    data: size=64m,nr_inodes=2k

# /proc (Java and Go need /proc/self/exe)
proc: true

# Standard /dev symlinks
symLink:
  - linkPath: /dev/fd
    target: /proc/self/fd
  - linkPath: /dev/stdin
    target: /proc/self/fd/0
  - linkPath: /dev/stdout
    target: /proc/self/fd/1
  - linkPath: /dev/stderr
    target: /proc/self/fd/2

# Hide sensitive host info
maskPath:
  - /sys/firmware
  - /sys/devices/virtual/powercap
  - /proc/acpi
  - /proc/asound
  - /proc/kcore
  - /proc/keys
  - /proc/latency_stats
  - /proc/timer_list
  - /proc/timer_stats
  - /proc/sched_debug
  - /proc/scsi

# Sandbox working directory
workDir: /w
hostName: aethercode-sandbox
domainName: aethercode-sandbox
uid: 1536
gid: 1536
